[package]
name = "riverbed"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/*", "bin/*"]

[dependencies]
bevy = { version = "*" }
crossbeam = "*"
rand_chacha = "*"
rb_camera = { path = "crates/rb_camera" }
rb_world = { path = "crates/rb_world" }
rb_physics = { path = "crates/rb_physics" }
rb_generation = { path = "crates/rb_generation" }
rb_logging = { path = "crates/rb_logging" }
rb_agents = { path = "crates/rb_agents" }
rb_sounds = { path = "crates/rb_sounds" }
rb_render = { path = "crates/rb_render" }
rb_ui = { path = "crates/rb_ui" }
mimalloc = "*"

[features]
logging = ["rb_logging/logging"]

[profile.dev]
opt-level = 1

[package.metadata.wgsl-analyzer]
edition = "2026_pre"
root = "assets/shaders"

[package.metadata.wgsl-analyzer.dependencies]
bevy_render = { path = "../bevy/crates/bevy_render" }
bevy_pbr = { path = "../bevy/crates/bevy_pbr" }
bevy_core_pipeline = { path = "../bevy/crates/bevy_core_pipeline" }
bevy_sprite_render = { path = "../bevy/crates/bevy_sprite_render" }
bevy_ui_render = { path = "../bevy/crates/bevy_ui_render" }
